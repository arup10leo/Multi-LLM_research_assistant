spring.application.name=assistant

# Gemini API configuration
# Set GEMINI_API_KEY or GEMINI_KEY as an environment variable,
# or replace this value directly for local development.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.api.key=
# Groq OpenAI-compatible config
# Use GROQ_API_KEY for Groq credentials.
spring.ai.openai.api-key=
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.1-8b-instant




# - Chat Memory
# - Conversation Storage
# - Vector Store


spring.datasource.url=jdbc:mariadb://mariadb:3306/ai_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.ai.vectorstore.mariadb.initialize-schema=true


# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =========================
# CHAT MEMORY
# =========================

spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.ai.chat.memory.repository.jdbc.platform=mariadb


#embedding configuration
#ollama config
spring.ai.ollama.base-url=http://ollama:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text


# MCP SERVER
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=research-assistant
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.transport=STDIO

#MCP CLIENT COMPATIBLE
logging.level.reactor.netty=INFO
spring.main.banner-mode=off
spring.output.ansi.enabled=never

logging.level.com.research.assistant=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.reactor.netty=INFO

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
